[project]
name = "comfyui-seedvr2-canonical"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch",
  "torchvision",
  "safetensors",
  "numpy",
  "tqdm",
  "psutil",
  "einops",
  "omegaconf==2.3.0",
  "diffusers>=0.33.1",
  "peft>=0.17.0",
  "rotary-embedding-torch>=0.5.3",
  "opencv-python",
  "gguf",
  "matplotlib",
  "antlr4-python3-runtime==4.9.3",
  "av",
  "transformers>=4.50.3,<5",
  "tokenizers>=0.22.0,<0.24.0",
  "huggingface-hub<1.0",
  "mediapy==1.2.0",
  "ipython==8.39.0",
  "beartype==0.22.9",
]

[tool.comfy.isolation]
can_isolate = true
share_torch = true
package_manager = "uv"
execution_model = "host-coupled"
share_torch_no_deps = [
  "einops",
  "antlr4-python3-runtime",
  "omegaconf",
  "opencv-python",
  "numpy",
  "av",
  "diffusers",
  "rotary-embedding-torch",
  "transformers",
  "tokenizers",
  "huggingface-hub",
  "safetensors",
  "mediapy",
  "ipython",
  "matplotlib",
  "beartype",
]

[tool.setuptools]
py-modules = ["nodes"]
