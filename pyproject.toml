[project]
name = "comfyui-seedvr2-canonical"
version = "0.1.0"
dependencies = [
  "einops==0.7.0",
  "torch==2.4.0+cu121",
  "omegaconf==2.3.0",
  "opencv-python==4.9.0.80",
  "numpy==1.24.4",
  "av==12.0.0",
  "diffusers==0.29.1",
  "rotary-embedding-torch==0.5.3",
  "transformers==4.38.2",
  "torchvision==0.19.0+cu121",
  "mediapy==1.2.0",
]

[tool.comfy.isolation]
can_isolate = true
share_torch = true
package_manager = "uv"
execution_model = "host-coupled"

[tool.setuptools]
py-modules = ["nodes"]
