[project]
name = "comfyui-seedvr2-canonical"
version = "0.1.0"
dependencies = [
  "einops==0.7.0",
  "torch==2.4.0+cu121",
  "omegaconf==2.3.0",
  "opencv-python==4.9.0.80",
  "numpy==1.24.4",
  "av==12.0.0",
  "diffusers==0.29.1",
  "rotary-embedding-torch==0.5.3",
  "transformers==4.38.2",
  "torchvision==0.19.0+cu121",
  "mediapy==1.2.0",
  "apex @ https://huggingface.co/ByteDance-Seed/SeedVR2-3B/resolve/main/apex-0.1-cp310-cp310-linux_x86_64.whl",
  "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.5.9.post1/flash_attn-2.5.9.post1%2Bcu122torch2.4cxx11abiFALSE-cp310-cp310-linux_x86_64.whl",
]

[tool.comfy.isolation]
can_isolate = true
share_torch = true
package_manager = "uv"
execution_model = "host-coupled"

[tool.comfy.isolation.cuda_wheels]
index_url = "https://pypi.org/simple"
packages = ["apex", "flash-attn"]

[tool.setuptools]
py-modules = ["nodes"]
