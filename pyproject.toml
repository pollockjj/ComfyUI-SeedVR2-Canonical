[project]
name = "comfyui-seedvr2-canonical"
version = "0.1.0"
dependencies = [
  "einops==0.7.0",
  "torch==2.3.0",
  "omegaconf==2.3.0",
  "opencv-python==4.9.0.80",
  "numpy<2",
  "diffusers==0.29.1",
  "rotary-embedding-torch==0.5.3",
  "transformers==4.38.2",
  "torchvision==0.18.0",
  "mediapy==1.2.0",
  "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.5.9.post1/flash_attn-2.5.9.post1%2Bcu122torch2.3cxx11abiFALSE-cp312-cp312-linux_x86_64.whl",
  "pyisolate==0.10.2",
]

[tool.comfy.isolation]
can_isolate = true
share_torch = false
package_manager = "uv"
execution_model = "sealed_worker"

[tool.setuptools]
py-modules = ["nodes"]
